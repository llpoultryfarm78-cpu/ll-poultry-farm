<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L&L Poultry Farm Admin</title><link rel="stylesheet" href="style.css"></head><body><header><h1>L&amp;L Poultry Farm</h1><p>Private farm dashboard</p></header><main>
<section class="panel"><b>Private area.</b> Sign in using the farm Gmail after Cloudflare Access is configured.</section>
<section class="panel"><h2>Connect website</h2><label>Worker API URL<input id="api" type="url" placeholder="https://your-worker.workers.dev"></label><button id="save">Save connection</button><p id="status"></p></section>
<section class="panel"><h2>Add or edit a listing</h2><form id="form"><input id="id" type="hidden"><label>Item name<input id="name" required maxlength="90"></label><label>Category<select id="category"><option>Chicks</option><option>Hens</option><option>Cocks</option><option>Eggs</option><option>Turkeys</option><option>Ducks</option><option>Geese</option><option>Guinea fowls</option><option>Other</option></select></label><label>Price (KSh)<input id="price" type="number" min="0"></label><label>Availability<select id="availability"><option>Available</option><option>Limited</option><option>Pre-order</option><option>Currently unavailable</option></select></label><label>Description<textarea id="description" maxlength="500"></textarea></label><label>Farm photo<input id="photo" type="file" accept="image/*"></label><button>Save listing</button><button type="button" class="secondary" id="clear">Clear</button></form></section>
<section class="panel"><h2>Current listings</h2><div id="list">Connect the API to load listings.</div></section>
<section class="panel"><h2>Farm announcement</h2><textarea id="announcement" maxlength="500" placeholder="Announcement for visitors"></textarea><button id="publish">Publish announcement</button></section></main><footer>Use genuine farm photos and accurate prices and availability.</footer><script src="app.js"></script></body></html>
